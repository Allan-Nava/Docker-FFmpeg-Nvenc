# action.yml
name: 'FFmpeg NVENC'
description: 'Runs FFmpeg (built with NVIDIA NVENC support) inside a container'
author: 'Allan Nava'

inputs:
  command:
    description: >
      Arguments passed to ffmpeg, e.g. "-i input.mp4 -c:v libx264 output.mp4".
      WARNING: GitHub-hosted runners have NO NVIDIA GPU, so the *_nvenc encoders
      are not usable here. NVENC needs a self-hosted runner with a GPU and the
      NVIDIA Container Toolkit.
    required: true

branding:
  icon: 'video'
  color: 'blue'

runs:
  using: 'docker'
  # Prebuilt image: the previous version rebuilt FFmpeg from source on every
  # invocation of the action (tens of minutes per job).
  #
  # NOTE: `runs.image` is static by specification — it does not accept
  # `${{ inputs… }}`, which is why there is no `image` input to override it (one
  # used to exist and did nothing). To pin a version, pin the action itself:
  # `uses: Allan-Nava/Docker-FFmpeg-Nvenc@vX.Y.Z`. Backlog: `action-ref-and-image-input`.
  image: 'docker://ghcr.io/allan-nava/docker-ffmpeg-nvenc:latest'
  # The image has ENTRYPOINT ["ffmpeg"]: passing `command` as a single element of
  # `args` would arrive as ONE argument. The shell wrapper does the splitting.
  entrypoint: '/bin/bash'
  args:
    - '-c'
    - 'ffmpeg ${{ inputs.command }}'
