name: Backlog

# docs/backlog.md is the single source of truth for todos: this workflow validates it and syncs it
# to GitHub issues (creating the missing milestones).
#
# Note: `sync` writes issues, so it never runs on pull requests — on a fork PR the GITHUB_TOKEN is
# read-only and the run would die on the first POST.
on:
  push:
    branches: [main]
    paths:
      - 'docs/backlog.md'
      - 'docs/scripts/**'
      - '.github/workflows/backlog.yml'
  pull_request:
    paths:
      - 'docs/backlog.md'
      - 'docs/scripts/**'
      - '.github/workflows/backlog.yml'
  schedule:
    # Mondays, after ci.yml's schedule (04:17): the backlog realigns downstream of it.
    - cron: '42 5 * * 1'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Actually apply it (create/update/close issues). false = plan only.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backlog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint backlog and generated pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tests
        run: python3 -m unittest discover -s tests -p 'test_backlog.py'

      - name: backlog-lint
        run: python3 docs/scripts/backlog-lint.py

      # roadmap.md is committed: if it diverged, the page in the repo would lie about the backlog.
      - name: generated-pages (roadmap.md up to date)
        run: python3 docs/scripts/generate-roadmap.py --check

  sync:
    name: Sync backlog -> issues
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # On push the run is informational (plan in the log); it applies from the schedule and from
      # a workflow_dispatch with apply=true.
      - name: Sync (dry-run)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply != true)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 docs/scripts/sync-backlog-to-issues.py

      - name: Sync (apply)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.apply == true)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 docs/scripts/sync-backlog-to-issues.py --apply

      - name: Summary
        if: always()
        run: |
          {
            echo "### Backlog"
            echo "- items: \`docs/backlog.md\` · roadmap: \`docs/roadmap.md\`"
            echo "- [repository milestones](${{ github.server_url }}/${{ github.repository }}/milestones)"
            echo "- [\`backlog-sync\` issues](${{ github.server_url }}/${{ github.repository }}/issues?q=is%3Aissue+label%3Abacklog-sync)"
          } >> "$GITHUB_STEP_SUMMARY"
