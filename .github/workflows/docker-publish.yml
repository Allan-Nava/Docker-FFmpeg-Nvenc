name: Publish

# Un push di tag pubblica tutte le varianti su GHCR.
# Ogni variante viene buildata, TESTATA e solo dopo pushata.
#
# NB: niente `workflow_dispatch` — i tag sono generati da `type=semver`, che
# produce risultati solo su eventi tag: un run manuale finirebbe con lista tag
# vuota e push fallito. Per pubblicare si tagga.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish ffmpeg ${{ matrix.ffmpeg }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # `default: true` pubblica ANCHE i tag senza suffisso (v1.2.3, v1.2, v1, latest).
          - ffmpeg: '7.1.1'
            nvcodec: 'sdk/12.1'
            default: true
          - ffmpeg: '6.0'
            nvcodec: 'sdk/12.0'
            default: false
          - ffmpeg: '5.1.2'
            nvcodec: 'sdk/11.0'
            default: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Tag con suffisso di variante: v1.2.3-ffmpeg7.1.1, latest-ffmpeg7.1.1, ...
      - name: Metadata (variante)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=true
            suffix=-ffmpeg${{ matrix.ffmpeg }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Solo per la variante di default: v1.2.3, v1.2, v1, latest (senza suffisso).
      - name: Metadata (default, senza suffisso)
        id: meta_default
        if: matrix.default
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Build locale per poter testare PRIMA di pubblicare. La push successiva
      # riusa la cache, quindi non ricompila.
      - name: Build per test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ffmpeg-nvenc:candidate
          build-args: |
            FFMPEG_VERSION=${{ matrix.ffmpeg }}
            NVCODEC_BRANCH=${{ matrix.nvcodec }}
          cache-from: type=gha,scope=ffmpeg-${{ matrix.ffmpeg }}
          cache-to: type=gha,scope=ffmpeg-${{ matrix.ffmpeg }},mode=max

      - name: Smoke test (gate di pubblicazione)
        run: ./tests/smoke.sh ffmpeg-nvenc:candidate ${{ matrix.ffmpeg }}

      - name: Login su GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta_default.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FFMPEG_VERSION=${{ matrix.ffmpeg }}
            NVCODEC_BRANCH=${{ matrix.nvcodec }}
          cache-from: type=gha,scope=ffmpeg-${{ matrix.ffmpeg }}
          provenance: true
          sbom: true

      - name: Riepilogo
        run: |
          {
            echo "### FFmpeg ${{ matrix.ffmpeg }} (nv-codec-headers ${{ matrix.nvcodec }})"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "${{ steps.meta_default.outputs.tags }}"
            echo '```'
            echo "digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
